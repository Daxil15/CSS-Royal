<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store</title>
</head>
<style>
    body {
        background-color: #f2f2f2;
    }

    h1 {
        background-color: #2b2f33;
        color: white;
        text-align: center;
        font-weight: bold;
        padding: 1%;
        margin: 2% 2%;
    }

    div {
        width: 300px;
        border: 3px solid #2b2f33;   
        padding: 15px;
        margin: 20px auto;
    }

    h3 {
        border-top-style: solid;
        border-top-color: red;
        border-left-style: dotted;
        border-left-color: orange;
        border-right-style: dashed;
        border-right-color: blue;
        border-bottom-style: double;
        border-bottom-color: green;
        padding: 10px;
        text-align: center;
        color: #1e3a5f;
    }

    p {
        border: 4px groove;
        border-color: purple;
    }

    .price {
        border-style: dashed;
        border-color: green;
        border-radius: 10px;
        color: green;
        width: 87%;
        text-align: center;
    }

    .buy-button {
        color: black;
        text-align: center;
        padding: 10px;
        cursor: pointer;
        border-radius: 10px;
        width: 100px;
        margin: 10px auto;

    }

    h2 {
        border-top-style: double;
        background-color: #2b2f33;
        color: white;
        text-align: center;
        font-weight: bold;
        padding: 1%;
        margin: 2% 2%;
    }
</style>
<body>
    <h1>Product Store</h1>
    <div>
        <h3>Wireless Headphones</h3>
        <p>Experience crystal-clear sound with our wireless headphones. Perfect for music lovers and professionals alike.</p>
        <div class="price">$99.99</div>
        <div class="buy-button">Buy Now</div>
    </div>
    <h2>© 2026 Product Store</h2>
</body>
</html>
