<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Notice Board</title>

    <style>
        body{
            background-color: #f2f2f2;;
        }
        h1{
            background-color:#1e3a5f;
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 1%;
            margin: 2% 2%;
        }

        div{
            background-color: white;
            width: 50% ;
            padding: 2%;
            height: 100%;
            margin: auto;
            border: 2px solid #1e3a5f;
        }

        h3{
            color: #1e3a5f;
            background-color: #afc9eb;
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            text-align: center;
            font-weight: bold;
            padding: 1%;
            margin: 2% 2%;
        }
        h5{
            background-color:#1e3a5f;
            color: #ffffff;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            padding: 1%;
            margin: 2% 2%;
        }
    </style>
</head>
<body>

    <h1>College Notice Board</h1>
    <div>
        <h3>Important Notice</h3>
        <p>All students are informed that the internal examination will be conducted next week.</p>
        <p>Students must bring their ID cards and admit cards.</p>
        <p>Date: 25 August 2026</p>
        <p>Time: 10:00 AM</p>

    </div>
    <h5>ABC Engineering College</h5>
</body>
</html>
