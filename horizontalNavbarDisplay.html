<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Bar | Daemo</title>
    <style>
        body{
            margin: 0;
        }
        nav{
            background-color: black;
        }

        nav ul{
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
        }
        nav ul a{
            text-decoration: none;
            display: block;
            padding: 8px 16px;
            color: white;
            float: left; 
        }
        nav ul a:hover{
            background-color: chartreuse;
            color: black;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="@">Home</a></li>
            <li><a href="@">About Us</a></li>
            <li><a href="@">FAQ</a></li>
            <li><a href="@">Contact US</a></li>
        </ul>
    </nav>
</body>
</html>
