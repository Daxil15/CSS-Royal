<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Hotel</title>
    <link rel="stylesheet" href="hotel.css">
    <style>
        body{
            margin: 0;
            background-color: #cacaca;  /* light background color */
        }
        .header {
            width: 100%;
            height: 120px;
            background: #2b2f33;  /* dark color */
            border-bottom: 4px solid orange;
            margin: 0 0;
        }
        .title {
            font-size: 35px;
            color: white;
            text-align: center;
            margin: 0;
            padding-top: 25px;
            font-family: 'Arial', sans-serif;
        }
        .sub-title {
            font-size: 20px;
            color: white;
            text-align: center; 
            font-family: 'Arial', sans-serif;
            margin: 2;
        }
        .hotel-card{
            width: 600px;
            height: 700px;
            background-color: white;
            border-width: 1px;
            border-style: solid;
            border-color: #2b2f33;
            border-radius: 2%;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="header">
        <p class="title">Grand Palace Hotel</p>
        <p class="sub-title">Your comfort is our priority</p>
    </div>    
    <div class="hotel-card">

    </div>
</body>
</html>
