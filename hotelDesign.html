<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greand Palace Hotel</title>
    <style>
        body{
            margin: 0;
        }
        .header{
            background-color: rgb(59, 5, 5);
            height: 70px;
            width: 100%;
            display: flex;
        }
        .title{
            font-size: 35px;
            color: white;
            padding: 18px 10px;
        }
        .nav{
            text-align: end;
            width: 1000px;
            padding-top: 23px;
            font-size: larger;
        }
        a{
            color:white;
            text-decoration: none;
        }
        a:hover{
            border-bottom: 2px solid rgb(255, 255, 255);
        }
        .ads{
            background-image: url("luxurious-hotel-lobby-stockcake.jpg");
            width: 100%;
            height: 400px;
            background-size: cover; 
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding-top: 100px;
        }
        .ads-title{
            color:white;
            font-size: 50px;
            text-align: center;
            font-weight: bolder;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        .ads-text{
            color:white;
            font-size: 30px;
            text-align: center;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        .exp-btn{
            color:white;
            font-size: 16px;
            margin: 10px auto;
            padding-top: 13px;
            padding-left: 80px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            width: 180px;
            height: 30px;
            border: 2px solid white;
        }
        .exp-btn:hover
        {
            color: black;
            background-color: gray;
            opacity: 0.6;
        }

        hr{
            background-color:rgb(180, 169, 169);
            border: 1px solid rgb(180, 169, 169) ;
            height: 3px;
            margin: 0;
            padding: 0;
        }
        
    </style>
</head>
<body>
    <!--     -->
    <div class="header">
        <div class="title">Grand Palace Hotel</div>
        <div class="nav">
            <a href="#">Home</a>&nbsp;&nbsp;&nbsp;&nbsp;
            <a href="#">Rooms</a>&nbsp;&nbsp;&nbsp;&nbsp;
            <a href="#">Offers</a>&nbsp;&nbsp;&nbsp;&nbsp;
            <a href="#">Contact</a>&nbsp;&nbsp;&nbsp;&nbsp;
        </div>
    </div>
    <hr>
    <div class="ads">
        <div class="ads-title">Experience Luxury & Comfort</div>
        <div class="ads-text">Your perfect stay begins here.</div>
        <div class="exp-btn">Explore Rooms</div>
    </div>
</body>
</html>
