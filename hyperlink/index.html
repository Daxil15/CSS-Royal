<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo | Hyper-Link</title>
    <style>
        body{
            margin: 0;
        }
        .main{
            width: 100%;
            height: 100px;
            background-color: #162b46;
            font-size: 30px;
            display: flex;
            align-items: center;
        }
        a{
            color: aliceblue;
            flex:auto;
            text-align: center;
            text-decoration: none;
        }
        
        a:visited{
            color: brown;
        }
        a:active{
            color:cornflowerblue;
        }
        a:hover{
            border: 2px solid aliceblue;
            padding: 2px;
        }
    </style>
</head>
<body>
    <div class="main">
        <a href="$">Home</a>
        <a href="!">Mobiles</a>
        <a href="@">Fashion</a>
    </div>
</body>
</html>
