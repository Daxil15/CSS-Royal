<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo | Hyper-Link</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        body{
            margin: 0;
        }
        .main{
            width: 100%;
            height: 100px;
            background-color: #162b46;
            font-size: 30px;
            display: flex ;
            align-items: center;
        }
        a{
            color: aliceblue;
            flex:auto;
            text-align: center;
            text-decoration: none;
        }
        
        a:visited{
            color: rgb(166, 197, 243);
        }
        a:active{
            color:cornflowerblue;
        }
        a:hover{
            border: 2px solid aliceblue;
            padding: 2px;
        }
    </style>
</head>
<body>
    <div class="main">
        <a href="#"><i class="fa-regular fa-house"></i>&nbsp;&nbsp;Home</a>
        <a href=""><i class="fa-brands fa-amazon-pay"></i>&nbsp;&nbsp;Amazon Pay</a>
        <a href=""><i class="fa-solid fa-tags"></i>&nbsp;&nbsp;Today's Deal's</a>
        <a href=""><i class="fa-solid fa-ticket"></i>&nbsp;&nbsp;Coupons</a>
        <a href=""><i class="fa-solid fa-cart-shopping"></i>&nbsp;&nbsp;Cart  </a>
    </div>
</body>
</html>
