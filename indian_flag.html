<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Flag</title>
</head>

<style>
    .flag{
        border: 2px solid black;
        width: 300px;
        height: 200px;
        margin: 0 auto;
    }
    .saffron{
        background-color: #FF9933;
        height: 33.33%;
    }
    .white{
        background-color: #FFFFFF;
        height: 33.33%;
    }
    .green{
        background-color: #138808;
        height: 33.33%;
    }
</style>

<body>
    <div class="flag">
        <div class="saffron"></div>
        <div class="white"></div>
        <div class="green"></div>
    </div>
</body>
</html>
