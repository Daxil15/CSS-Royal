<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Style | Types</title>
    
    <style>
        .def{
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        .sqr{
            list-style-type: square;
        }
        .amr{
            list-style-type: armenian;
        } 
        .csslogo{
            list-style-image: url("technology.png");
        }
        .str{
            list-style-image: url("android.png");
            list-style-position: inside;
        }
    </style>
</head>
<body>
    <ul class="def">
        <li>Home</a></li>
        <li>Contact US</a></li>
        <li>FAQ's</a></li>
        <li>Login</a></li>
    </ul>
    <ul class="sqr">
        <li>Home</a></li>
        <li>Contact US</a></li>
        <li>FAQ's</a></li>
        <li>Login</a></li>
    </ul>
    <ul class="amr">
        <li>Home</li>
        <li>Contact US</a></li>
        <li>FAQ's</a></li>
        <li>Login</a></li>
    </ul>
    <ul class="csslogo">
        <li>Home</li>
        <li>Contact US</a></li>
        <li>FAQ's</a></li>
        <li>Login</a></li>
    </ul>
    <ul class="str">
        <li>Home</li>
        <li>Contact US</a></li>
        <li>FAQ's</a></li>
        <li>Login</a></li>
    </ul>
</body>
</html>
