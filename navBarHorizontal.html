<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavBar | horizontal</title>
    <style>
        ul{
            list-style: none;
            background-color:rgb(174, 176, 248);
            margin: 0;
            padding: 0;

        }   
        ul li{
            float: left;
        }
        li a{
            text-decoration: none;
            display: block;
            padding: 8px 16px;
            color: black;
        }
        li a:hover{
            background-color: rgb(248, 148, 17);
            color:rgb(252, 252, 252)
        }
    </style>
</head>
<body>
    <div>
        <ul>
            <li><a href="%">Home</a></li>
            <li><a href="!">Contact US</a></li>
            <li><a href="@">FAQ's</a></li>
            <li><a href="$">Login</a></li>
        </ul>
    </div>
</body>
</html>
