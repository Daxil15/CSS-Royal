<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .red{
        background-color: red;
        width: 100px;
        height: 100px;
        border-style: solid;
    }
    .blue{
        background-color: blue;
        width: 200px;
        height: 100px;
        margin-left: 100px;
        border-style: groove;
    }
    .green{
        background-color: green;
        width: 400px;
        height: 100px;
        margin-left: 300px;
        border-style: dotted;
    }
</style>
<body>
    <div class="red"></div>
    <div class="blue"></div>
    <div class="green"></div>
</body>
</html>
