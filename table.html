<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <style>
        table{
            border-style: solid ;
            width: 500px;
            height: 500px;
            border-collapse: collapse;
            background-color: rgb(95, 158, 160);
            margin-left: auto;
            margin-right: auto;
        }

        th{
            border-style: solid ;
            width: 500px;
            background-color: rgb(67, 116, 117);
        }

        td{
            border-style: solid ;
            width: 500px;
            text-align: center;
        }
        .fa-solid{
            font-size: 100px;
            height: 90px;
        }
    </style>

</head>
<body>
    <table>
        <tr>
            <th><i class="fa-solid fa-car"></i></th>
            <th><i class="fa-solid fa-user-tie"></i></th>
            <th><i class="fa-solid fa-indian-rupee-sign"></i></th>
        </tr>
        <tr>
            <td>Range Rovre</td>
            <td>Narendra Modi</td>
            <td>1.5B</td>
        </tr>
        <tr>
            <td>Rolls Royes</td>
            <td>Mukesh Ambani</td>
            <td>10.20M</td>
        </tr>
        <tr>
            <td>Lamborgini</td>
            <td>Elonmask</td>
            <td>1.2M</td>
        </tr>
    </table>
</body>
</html>
