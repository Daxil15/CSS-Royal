<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon | Navbar</title>
    <style>
        body{
            background-color: rgb(199, 224, 246);
            padding: 10px;
        }
        nav{
            font-size: 30px;
        }

        img{
            padding: 10px;
        }
        
        .index{
            border: 2px;
            border-radius: 10px;
            list-style-type: none;
            background-color: white;
            width: 50px;
            padding-left: 15px;
            padding-right: 15px;
            margin: 0;
        }

        .home :hover{
            background-color: rgb(190, 190, 243);
            border: 2px;
            border-radius: 10px;
        }

        .message :hover{
            background-color: rgb(190, 190, 243);
            border: 2px;
            border-radius: 10px;
        }

        .group :hover{
            background-color: rgb(190, 190, 243);
            border: 2px;
            border-radius: 10px;
        }
        
        .folder :hover{
            background-color: rgb(190, 190, 243);
            border: 2px;
            border-radius: 10px;
        }
        
        .box :hover{
            background-color: rgb(190, 190, 243);
            border: 2px;
            border-radius: 10px;
        }
        
        .question :hover{
            background-color: rgb(190, 190, 243);
            border: 2px;
            border-radius: 10px;
        }
        
        .setting :hover{
            background-color: rgb(190, 190, 243);
            border: 2px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <ul class="index">
            <li class="home"><a href="@"><img src="home (1).png"></a></li>
            <li class="message"><a href="@"><img src="message.png"></a></li>
            <li class="group"><a href="@"><img src="team.png"></a></li>
            <li class="folder"><a href="@"><img src="folder.png"></a></li>
            <li class="box"><a href="@"><img src="box (1).png"></a></li>
            <li class="question"><a href="@"><img src="question.png"></a></li>
            <li class="setting"><a href="@"><img src="setting.png"></a></li>
        </ul>
    </nav>
</body>
</html>
